<widget tag="div">
    <div class="container">
        <div class="tc-box">
            <div class="headtitle">
                <h2>{$widget.title}</h2>
            </div>
            <div class="posts">
                <if condition="isset($widget['vars']['last_articles_category_id'])">
                    <portal:articlesI18n limit="5" order="post.published_time DESC"
                                     categoryIds="$widget.vars.last_articles_category_id">
                        <php>
                            $_m_category_id=0;
                            $_m_categories=$vo['categories'];
                            if(!empty($_m_categories[0])){
                            $_m_category_id=$_m_categories[0]['id'];
                            }
                        </php>
                        <dl class="dl-horizontal">
                            <dt>
                                <a class="img-wraper"
                                   href="{:cmf_url('portal/Article/index',array('id'=>$vo.post_id,'cid'=>$_m_category_id))}">
                                    <if condition="empty($vo.more.thumbnail)">
                                        <img src="__TMPL__/public/assets/images/default_tupian4.png"
                                             class="img-responsive" alt="{$vo.post_title}"/>
                                        <else/>
                                        <img src="{:cmf_get_image_url($vo.more.thumbnail)}"
                                             class="img-responsive" alt="{$vo.post_title}"/>
                                    </if>
                                </a>
                            </dt>
                            <dd>
                                <a href="{:cmf_url('portal/Article/index',array('id'=>$vo['post_id'],'cid'=>$_m_category_id))}">{$vo.post_title}</a>
                            </dd>
                        </dl>
                    </portal:articlesI18n>
                </if>
            </div>
        </div>
    </div>
</widget>
